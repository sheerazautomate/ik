<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Munshi M.Siddique Iron Store — Bill</title>
<style>
  :root{
    --orange:#f2a93d;
    --orange-dark:#e0921f;
    --navy:#1c2b45;
    --border:#333;
    --bg:#f6f5f2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--navy);
  }
  .sheet{
    max-width:820px;
    margin:16px auto;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 14px rgba(0,0,0,0.12);
  }
  .brand-bar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:20px 24px 10px;
  }
  .cube{
    width:38px;height:38px;flex:none;
    border:3px solid var(--navy);
    transform:rotate(45deg);
    position:relative;
  }
  .cube::after{
    content:"";
    position:absolute;inset:6px;
    border:2px solid var(--orange);
  }
  .brand-text h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
  }
  .brand-underline{
    height:4px;
    width:220px;
    background:var(--orange);
    margin:6px 0 18px 24px;
    border-radius:2px;
  }
  .meta{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 24px;
    padding:0 24px 18px;
  }
  .field{
    display:flex;
    align-items:baseline;
    gap:8px;
    border-bottom:1.5px solid #bbb;
    padding-bottom:4px;
  }
  .field label{
    font-size:.85rem;
    font-weight:600;
    white-space:nowrap;
  }
  .field input{
    border:none;
    outline:none;
    flex:1;
    font-size:.95rem;
    background:transparent;
    color:var(--navy);
    min-width:0;
  }
  table{
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
  }
  thead th{
    background:var(--orange);
    color:var(--navy);
    text-align:left;
    padding:10px 14px;
    font-size:.85rem;
    letter-spacing:.5px;
    border:1px solid var(--orange-dark);
  }
  tbody td{
    border:1px solid #ddd;
    padding:8px 14px;
    font-size:.9rem;
  }
  tbody td:first-child{font-weight:600;}
  tbody input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    font-size:.9rem;
    color:var(--navy);
    text-align:right;
  }
  .totals{
    padding:18px 24px;
  }
  .totals .field{margin-bottom:12px;}
  .totals .field label{min-width:150px;}
  #totalAmount, #remainingAmount{font-weight:700;}
  .signature{
    padding:6px 24px 20px;
    border-bottom:1.5px solid #bbb;
    margin:0 24px 18px;
    display:flex;
    gap:8px;
    align-items:baseline;
  }
  .signature label{font-size:.85rem;font-weight:600;}
  footer{
    background:var(--navy);
    color:#fff;
    padding:14px 24px;
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    gap:8px;
    font-size:.8rem;
  }
  footer .badge{color:var(--orange);font-weight:600;}
  .actions{
    display:flex;
    gap:10px;
    padding:16px 24px 24px;
    flex-wrap:wrap;
  }
  button{
    border:none;
    border-radius:8px;
    padding:12px 20px;
    font-size:.95rem;
    font-weight:600;
    cursor:pointer;
  }
  #saveBtn{background:var(--navy);color:#fff;}
  #printBtn{background:var(--orange);color:var(--navy);}
  #newBtn{background:#eee;color:var(--navy);}
  #statusMsg{
    padding:0 24px 10px;
    font-size:.85rem;
    min-height:1.2em;
  }
  #statusMsg.ok{color:#1a7a3c;}
  #statusMsg.err{color:#b3261e;}

  @media print{
    body{background:#fff;}
    .actions,#statusMsg{display:none !important;}
    .sheet{box-shadow:none;margin:0;max-width:100%;}
    .field, .signature{border-bottom:1px solid #999;}
    input{color:#000 !important;}
    thead th{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="brand-bar">
    <div class="cube"></div>
    <div class="brand-text"><h1>Munshi M.Siddique Iron Store</h1></div>
  </div>
  <div class="brand-underline"></div>

  <div class="meta">
    <div class="field"><label>Customer Name:</label><input id="customerName" type="text"></div>
    <div class="field"><label>Mobile No:</label><input id="mobileNo" type="tel"></div>
    <div class="field"><label>Order Date:</label><input id="orderDate" type="date"></div>
    <div class="field"><label>Delivery Date:</label><input id="deliveryDate" type="date"></div>
    <div class="field"><label>Steel Brand:</label><input id="steelBrand" type="text"></div>
  </div>

  <table>
    <thead>
      <tr><th>Details</th><th>Weight</th><th>Rate</th><th>Total</th></tr>
    </thead>
    <tbody id="itemsBody"></tbody>
  </table>

  <div class="totals">
    <div class="field"><label>Total Amount:</label><span id="totalAmount">0</span></div>
    <div class="field"><label>Received Amount:</label><input id="receivedAmount" type="number" min="0" value="0"></div>
    <div class="field"><label>Remaining Amount:</label><span id="remainingAmount">0</span></div>
  </div>

  <div class="signature"><label>Signature:</label></div>

  <div id="statusMsg"></div>

  <div class="actions">
    <button id="saveBtn">Save &amp; Set Reminder</button>
    <button id="printBtn">Print</button>
    <button id="newBtn">New Bill</button>
  </div>

  <footer>
    <span>📞 +923076377724 / +923429407724</span>
    <span class="badge">f</span>
    <span>@ Munshi M.Siddique Iron Store</span>
    <span>📍 Multan Road Chowk Azam</span>
  </footer>
</div>

<script>
// ============================================================
// PASTE your Google Apps Script Web App URL here after deploying Code.gs
// ============================================================
const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

const ITEM_NAMES = [
  "06 MM 2#", "10 MM 3#", "12 MM 4#", "16 MM 5#",
  "20 MM 6#", "25 MM 8#", "WIRE", "Cement", "OTHERS"
];

const itemsBody = document.getElementById("itemsBody");
ITEM_NAMES.forEach((name, i) => {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td>${name}</td>
    <td><input type="number" min="0" step="any" class="weight" data-i="${i}"></td>
    <td><input type="number" min="0" step="any" class="rate" data-i="${i}"></td>
    <td><span class="row-total" data-i="${i}">0</span></td>
  `;
  itemsBody.appendChild(tr);
});

function recalc(){
  let total = 0;
  ITEM_NAMES.forEach((name, i) => {
    const w = parseFloat(document.querySelector(`.weight[data-i="${i}"]`).value) || 0;
    const r = parseFloat(document.querySelector(`.rate[data-i="${i}"]`).value) || 0;
    const rowTotal = w * r;
    document.querySelector(`.row-total[data-i="${i}"]`).textContent = rowTotal.toFixed(2);
    total += rowTotal;
  });
  document.getElementById("totalAmount").textContent = total.toFixed(2);
  const received = parseFloat(document.getElementById("receivedAmount").value) || 0;
  document.getElementById("remainingAmount").textContent = (total - received).toFixed(2);
  return total;
}

itemsBody.addEventListener("input", recalc);
document.getElementById("receivedAmount").addEventListener("input", recalc);
recalc();

function collectData(){
  const items = ITEM_NAMES.map((name, i) => ({
    name,
    weight: parseFloat(document.querySelector(`.weight[data-i="${i}"]`).value) || 0,
    rate: parseFloat(document.querySelector(`.rate[data-i="${i}"]`).value) || 0,
    total: parseFloat(document.querySelector(`.row-total[data-i="${i}"]`).textContent) || 0
  }));
  return {
    customerName: document.getElementById("customerName").value,
    mobileNo: document.getElementById("mobileNo").value,
    orderDate: document.getElementById("orderDate").value,
    deliveryDate: document.getElementById("deliveryDate").value,
    steelBrand: document.getElementById("steelBrand").value,
    items,
    totalAmount: parseFloat(document.getElementById("totalAmount").textContent) || 0,
    receivedAmount: parseFloat(document.getElementById("receivedAmount").value) || 0,
    remainingAmount: parseFloat(document.getElementById("remainingAmount").textContent) || 0
  };
}

const statusMsg = document.getElementById("statusMsg");

document.getElementById("saveBtn").addEventListener("click", async () => {
  if (API_URL.indexOf("PASTE_YOUR") === 0) {
    statusMsg.className = "err";
    statusMsg.textContent = "Backend URL abhi set nahi hui — Code.gs deploy kar ke URL yahan paste karein.";
    return;
  }
  statusMsg.className = "";
  statusMsg.textContent = "Saving...";
  try{
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(collectData())
    });
    const result = await res.json();
    if(result.success){
      statusMsg.className = "ok";
      statusMsg.textContent = "Bill #" + result.billNo + " saved. " + result.calendarStatus;
    } else {
      statusMsg.className = "err";
      statusMsg.textContent = "Error: " + result.error;
    }
  }catch(err){
    statusMsg.className = "err";
    statusMsg.textContent = "Save failed: " + err;
  }
});

document.getElementById("printBtn").addEventListener("click", () => window.print());

document.getElementById("newBtn").addEventListener("click", () => {
  document.querySelectorAll("input").forEach(i => i.value = "");
  document.getElementById("receivedAmount").value = 0;
  statusMsg.textContent = "";
  recalc();
});
</script>

</body>
</html>
