<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Munshi M.Siddique Iron Store — Bill</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --orange:#f2a93d;
    --orange-dark:#e0921f;
    --navy:#1c2b45;
    --border:#333;
    --bg:#f6f5f2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Tahoma,Arial,sans-serif;
    background:var(--bg);
    color:var(--navy);
  }
  .topbar{
    max-width:820px;
    margin:16px auto 0;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:10px;
    padding:0 4px;
    font-size:.85rem;
  }
  .topbar .connected{color:#1a7a3c;font-weight:600;}
  #connectBtn{
    background:#fff;
    border:1.5px solid var(--navy);
    color:var(--navy);
    padding:8px 14px;
    border-radius:8px;
    font-weight:600;
    cursor:pointer;
    font-size:.85rem;
  }
  .sheet{
    max-width:820px;
    margin:10px auto 16px;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 14px rgba(0,0,0,0.12);
  }
  .brand-bar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:20px 24px 10px;
    width: fit-content; 
    margin: 0 auto;
  }
  .brand-text h1{
    margin:0;
    font-size:1.5rem;
    letter-spacing:.5px;
  }
  .brand-underline{
    height:4px;
    width:220px;
    background:var(--orange);
    margin: 0 auto;
    border-radius:2px;
  }
  .meta{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 24px;
    padding:16px 24px 18px;
  }
  .field{
    display:flex;
    align-items:baseline;
    gap:8px;
    border-bottom:1.5px solid #bbb;
    padding-bottom:4px;
  }
  .field label{
    font-size:.85rem;
    font-weight:600;
    white-space:nowrap;
  }
  .field input{
    border:none;
    outline:none;
    flex:1;
    font-size:.95rem;
    background:transparent;
    color:var(--navy);
    min-width:0;
  }
  table{
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
    text-align:center;
    table-layout:fixed;
  }
  thead th{
    background:var(--orange);
    color:var(--navy);
    padding:10px 14px;
    font-size:.85rem;
    letter-spacing:.5px;
    border:1px solid var(--orange-dark);
  }
  tbody td{
    border:1px solid #ddd;
    padding:3px 14px;
    font-size:.9rem;
    line-height:1.2;
  }
  tbody td:first-child{font-weight:600;}
  tbody input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    font-size:.9rem;
    color:var(--navy);
    text-align:center;
  }
  .totals{
    padding:22px 24px;
  }
  .totals .field{
    margin-bottom:18px;
    padding-bottom:10px;
    min-height:44px;
  }
  .totals .field label{
    min-width:190px;
    font-size:1.15rem;
  }
  .totals .field input,
  .totals .field span{
    font-size:1.4rem;
  }
  #totalAmount, #remainingAmount{font-weight:700;}
  .signature{
    padding:6px 24px 20px;
    border-bottom:1.5px solid #bbb;
    margin:0 24px 18px;
    display:flex;
    gap:8px;
    align-items:baseline;
  }
  .signature label{font-size:.85rem;font-weight:600;}
  footer{
    background:var(--navy);
    color:#fff;
    padding:14px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    font-size:.8rem;
    text-align:center;
  }
  footer .footer-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;}
  footer .badge{color:var(--orange);font-weight:600;}
  .actions{
    display:flex;
    gap:10px;
    padding:16px 24px 24px;
    flex-wrap:wrap;
  }
  button{
    border:none;
    border-radius:8px;
    padding:12px 20px;
    font-size:.95rem;
    font-weight:600;
    cursor:pointer;
  }
  button:disabled{opacity:.6;cursor:not-allowed;}
  #saveBtn{background:var(--navy);color:#fff;}
  #printBtn{background:var(--orange);color:var(--navy);}
  #newBtn{background:#eee;color:var(--navy);}
  #statusMsg{
    padding:0 24px 10px;
    font-size:.85rem;
    min-height:1.2em;
    white-space:pre-line;
  }
  #statusMsg.ok{color:#1a7a3c;}
  #statusMsg.err{color:#b3261e;}
  #statusMsg.working{color:#946200;}

  /* used only while html2canvas captures the bill, so buttons/status don't appear in the PDF */
  body.capturing .actions,
  body.capturing #statusMsg,
  body.capturing .topbar{
    display:none !important;
  }

  @media print{
    body{background:#fff;}
    .actions,#statusMsg,.topbar{display:none !important;}
    .sheet{box-shadow:none;margin:0;max-width:100%;}
    .field, .signature{border-bottom:1px solid #999;}
    input{color:#000 !important;}
    table, th, td{border:1px solid #000 !important;}
    table{border-collapse:collapse !important;}
    thead th{
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
      background:var(--orange) !important;
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <span id="connectedLabel" class="connected" style="display:none;"></span>
  <button id="connectBtn">Connect your Gmail</button>
</div>

<div class="sheet">
  <div class="brand-bar">
    <div class="brand-text"><h1>Munshi M.Siddique Iron Store</h1></div>
  </div>
  <div class="brand-underline"></div>

  <div class="meta">
    <div class="field"><label>Customer Name:</label><input id="customerName" type="text"></div>
    <div class="field"><label>Mobile No:</label><input id="mobileNo" type="tel"></div>
    <div class="field"><label>Order Date:</label><input id="orderDate" type="date"></div>
    <div class="field"><label>Delivery Date:</label><input id="deliveryDate" type="date"></div>
    <div class="field"><label>Steel Brand:</label><input id="steelBrand" type="text"></div>
    <div class="field"><label>Steel Grade:</label><input id="steelGrade" type="text"></div>
  </div>

  <table>
    <colgroup>
      <col style="width:25%">
      <col style="width:20%">
      <col style="width:20%">
      <col style="width:35%">
    </colgroup>
    <thead>
      <tr><th>Details</th><th>Weight</th><th>Rate</th><th>Total</th></tr>
    </thead>
    <tbody id="itemsBody"></tbody>
  </table>

  <div class="totals">
    <div class="field"><label>Total Amount:</label><span id="totalAmount">0</span></div>
    <div class="field"><label>Received Amount:</label><input id="receivedAmount" type="number" min="0" value="0"></div>
    <div class="field"><label>Remaining Amount:</label><span id="remainingAmount">0</span></div>
  </div>

  <div class="signature"><label>Signature:</label></div>

  <div id="statusMsg"></div>

  <div class="actions">
    <button id="saveBtn">Save &amp; Set Reminder</button>
    <button id="printBtn">Print</button>
    <button id="newBtn">New Bill</button>
  </div>

  <footer>
    <div class="footer-line"><span class="badge">f</span> <span>@ Munshi M.Siddique Iron Store</span></div>
    <div class="footer-line">📞 +923076377724 / +923429407724&nbsp;&nbsp;&nbsp;📍 Multan Road Chowk Azam</div>
  </footer>
</div>

<script>
// ============================================================
// One-time setup (done once by the developer, not by each shop):
// Paste your Google Cloud OAuth Client ID here. See SETUP_GUIDE.md
// ============================================================
const CLIENT_ID = "50983816826-0vhjff793nmc3psj5ib15epai1mnf48t.apps.googleusercontent.com"; // replaced automatically at deploy time from the GOOGLE_CLIENT_ID repo secret

const SCOPES = [
  "https://www.googleapis.com/auth/spreadsheets",
  "https://www.googleapis.com/auth/drive.file",
  "https://www.googleapis.com/auth/calendar.events",
  "https://www.googleapis.com/auth/userinfo.email"
].join(" ");

const FOLDER_NAME = "IronKingBills";
const SHEET_TITLE = "Iron Store Bills";
const SHEET_TAB = "Bills";
const HEADERS = [
  "Bill No","Timestamp","Customer Name","Mobile No","Steel Brand","Steel Grade",
  "Order Date","Delivery Date","Items (JSON)","Total Amount","Received Amount",
  "Remaining Amount","PDF Link","Reminder Status"
];

let tokenClient = null;
let accessToken = null;
let userEmail = null;
let pendingAction = null; // used to auto-run Save right after connecting
let silentAttemptInProgress = false; // true while trying to auto-restore the connection on load

const statusMsg = document.getElementById("statusMsg");
const connectBtn = document.getElementById("connectBtn");
const connectedLabel = document.getElementById("connectedLabel");

function setStatus(text, kind){
  statusMsg.textContent = text;
  statusMsg.className = kind || "";
}

function initGIS(){
  if (typeof google === "undefined" || !google.accounts){
    setTimeout(initGIS, 300);
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      if (resp.error){
        if (!silentAttemptInProgress){
          setStatus("Connect failed: " + resp.error, "err");
        }
        silentAttemptInProgress = false;
        return;
      }
      silentAttemptInProgress = false;
      accessToken = resp.access_token;
      await loadUserEmail();
      connectBtn.textContent = "Reconnect";
      connectedLabel.style.display = "inline";
      connectedLabel.textContent = "Connected: " + (userEmail || "");
      if (pendingAction){
        const action = pendingAction;
        pendingAction = null;
        action();
      }
    }
  });

  // Try to silently restore the connection on every page load/refresh —
  // no popup shown if the browser still has an active Google session and
  // the user already granted access before. Fails quietly on first-ever visit.
  silentAttemptInProgress = true;
  tokenClient.requestAccessToken({ prompt: "" });
}
window.addEventListener("load", initGIS);

connectBtn.addEventListener("click", () => {
  if (!tokenClient){ setStatus("Google login abhi load ho raha hai, thoda ruk kar dobara try karein.", "err"); return; }
  tokenClient.requestAccessToken({ prompt: accessToken ? "" : "consent" });
});

async function loadUserEmail(){
  try{
    const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
      headers: { Authorization: "Bearer " + accessToken }
    });
    const data = await res.json();
    userEmail = data.email || null;
  }catch(err){ userEmail = null; }
}

function ensureConnected(next){
  if (accessToken){ next(); return; }
  pendingAction = next;
  tokenClient.requestAccessToken({ prompt: "consent" });
}

// ---------- Drive helpers ----------
async function driveFindByName(name, mimeType){
  const q = "name='" + name.replace(/'/g, "\\'") + "' and mimeType='" + mimeType + "' and trashed=false";
  const res = await fetch("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) + "&fields=files(id,name)", {
    headers: { Authorization: "Bearer " + accessToken }
  });
  const data = await res.json();
  return (data.files && data.files.length) ? data.files[0].id : null;
}

async function getOrCreateFolder(){
  let id = await driveFindByName(FOLDER_NAME, "application/vnd.google-apps.folder");
  if (id) return id;
  const res = await fetch("https://www.googleapis.com/drive/v3/files", {
    method: "POST",
    headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
    body: JSON.stringify({ name: FOLDER_NAME, mimeType: "application/vnd.google-apps.folder" })
  });
  const created = await res.json();
  return created.id;
}

async function getOrCreateSheet(folderId){
  let id = await driveFindByName(SHEET_TITLE, "application/vnd.google-apps.spreadsheet");
  if (id) return id;

  const createRes = await fetch("https://sheets.googleapis.com/v4/spreadsheets", {
    method: "POST",
    headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
    body: JSON.stringify({
      properties: { title: SHEET_TITLE },
      sheets: [{ properties: { title: SHEET_TAB } }]
    })
  });
  const created = await createRes.json();
  id = created.spreadsheetId;

  // move it into the IronKingBills folder
  await fetch("https://www.googleapis.com/drive/v3/files/" + id + "?addParents=" + folderId + "&removeParents=root", {
    method: "PATCH",
    headers: { Authorization: "Bearer " + accessToken }
  });

  // write header row
  await fetch("https://sheets.googleapis.com/v4/spreadsheets/" + id + "/values/" + encodeURIComponent(SHEET_TAB + "!A1") + "?valueInputOption=RAW", {
    method: "PUT",
    headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
    body: JSON.stringify({ values: [HEADERS] })
  });

  return id;
}

async function appendRow(spreadsheetId, rowValues){
  const range = SHEET_TAB + "!A:N";
  const res = await fetch("https://sheets.googleapis.com/v4/spreadsheets/" + spreadsheetId + "/values/" + encodeURIComponent(range) + ":append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS", {
    method: "POST",
    headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
    body: JSON.stringify({ values: [rowValues] })
  });
  return res.json();
}

async function updateCells(spreadsheetId, range, values){
  await fetch("https://sheets.googleapis.com/v4/spreadsheets/" + spreadsheetId + "/values/" + encodeURIComponent(range) + "?valueInputOption=USER_ENTERED", {
    method: "PUT",
    headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
    body: JSON.stringify({ values: [values] })
  });
}

async function uploadPdf(folderId, filename, blob){
  const metadata = { name: filename, mimeType: "application/pdf", parents: [folderId] };
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
  form.append("file", blob);
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink", {
    method: "POST",
    headers: { Authorization: "Bearer " + accessToken },
    body: form
  });
  return res.json();
}

async function createCalendarEvent(data, billNo){
  const deliveryDate = new Date(data.deliveryDate);
  deliveryDate.setHours(9, 0, 0, 0);
  const endDate = new Date(deliveryDate.getTime() + 60 * 60 * 1000);

  const event = {
    summary: "Delivery Due: " + (data.customerName || "Customer") + " (Bill #" + billNo + ")",
    description:
      "Mobile: " + (data.mobileNo || "-") + "\n" +
      "Steel Brand: " + (data.steelBrand || "-") + "\n" +
      "Steel Grade: " + (data.steelGrade || "-") + "\n" +
      "Total Amount: " + data.totalAmount + "\n" +
      "Remaining: " + data.remainingAmount,
    start: { dateTime: deliveryDate.toISOString() },
    end: { dateTime: endDate.toISOString() },
    reminders: {
      useDefault: false,
      overrides: [
        { method: "popup", minutes: 1440 },
        { method: "email", minutes: 1440 }
      ]
    }
  };

  const res = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
    method: "POST",
    headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" },
    body: JSON.stringify(event)
  });
  return res.json();
}

async function generatePdfBlob(){
  document.body.classList.add("capturing");
  const el = document.querySelector(".sheet");
  const canvas = await html2canvas(el, { scale: 2, useCORS: true });
  document.body.classList.remove("capturing");
  const imgData = canvas.toDataURL("image/png");
  const jsPDFCtor = window.jspdf.jsPDF;
  const pdf = new jsPDFCtor({ unit: "px", format: [canvas.width, canvas.height] });
  pdf.addImage(imgData, "PNG", 0, 0, canvas.width, canvas.height);
  return pdf.output("blob");
}

// ---------- Bill items table ----------
const ITEM_NAMES = [
  "06 MM 2#", "10 MM 3#", "12 MM 4#", "16 MM 5#",
  "20 MM 6#", "25 MM 8#", "WIRE", "Cement", "OTHERS"
];

const itemsBody = document.getElementById("itemsBody");
ITEM_NAMES.forEach((name, i) => {
  const tr = document.createElement("tr");
  tr.innerHTML =
    "<td>" + name + "</td>" +
    "<td><input type='number' min='0' step='any' class='weight' data-i='" + i + "'></td>" +
    "<td><input type='number' min='0' step='any' class='rate' data-i='" + i + "'></td>" +
    "<td><span class='row-total' data-i='" + i + "'>0</span></td>";
  itemsBody.appendChild(tr);
});

function recalc(){
  let total = 0;
  ITEM_NAMES.forEach((name, i) => {
    const w = parseFloat(document.querySelector(".weight[data-i='" + i + "']").value) || 0;
    const r = parseFloat(document.querySelector(".rate[data-i='" + i + "']").value) || 0;
    const rowTotal = w * r;
    document.querySelector(".row-total[data-i='" + i + "']").textContent = rowTotal.toFixed(2);
    total += rowTotal;
  });
  document.getElementById("totalAmount").textContent = total.toFixed(2);
  const received = parseFloat(document.getElementById("receivedAmount").value) || 0;
  document.getElementById("remainingAmount").textContent = (total - received).toFixed(2);
  return total;
}

itemsBody.addEventListener("input", recalc);
document.getElementById("receivedAmount").addEventListener("input", recalc);
recalc();

function collectData(){
  const items = ITEM_NAMES.map((name, i) => ({
    name: name,
    weight: parseFloat(document.querySelector(".weight[data-i='" + i + "']").value) || 0,
    rate: parseFloat(document.querySelector(".rate[data-i='" + i + "']").value) || 0,
    total: parseFloat(document.querySelector(".row-total[data-i='" + i + "']").textContent) || 0
  }));
  return {
    customerName: document.getElementById("customerName").value,
    mobileNo: document.getElementById("mobileNo").value,
    orderDate: document.getElementById("orderDate").value,
    deliveryDate: document.getElementById("deliveryDate").value,
    steelBrand: document.getElementById("steelBrand").value,
    steelGrade: document.getElementById("steelGrade").value,
    items: items,
    totalAmount: parseFloat(document.getElementById("totalAmount").textContent) || 0,
    receivedAmount: parseFloat(document.getElementById("receivedAmount").value) || 0,
    remainingAmount: parseFloat(document.getElementById("remainingAmount").textContent) || 0
  };
}

// ---------- Save & Set Reminder ----------
document.getElementById("saveBtn").addEventListener("click", () => {
  if (CLIENT_ID.indexOf("__GOOGLE_CLIENT_ID__") === 0){
    setStatus("OAuth Client ID abhi set nahi hui — GitHub Actions deploy hone ka intezar karein ya SETUP_GUIDE.md dekhein.", "err");
    return;
  }
  ensureConnected(runSave);
});

async function runSave(){
  const saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true;
  try{
    setStatus("Connecting to your Drive...", "working");
    const folderId = await getOrCreateFolder();

    setStatus("Preparing your sheet...", "working");
    const spreadsheetId = await getOrCreateSheet(folderId);

    const data = collectData();
    const timestamp = new Date().toISOString();

    setStatus("Saving bill...", "working");
    const appendResult = await appendRow(spreadsheetId, [
      "", timestamp, data.customerName, data.mobileNo, data.steelBrand, data.steelGrade,
      data.orderDate, data.deliveryDate, JSON.stringify(data.items),
      data.totalAmount, data.receivedAmount, data.remainingAmount, "", "Processing..."
    ]);
    const updatedRange = (appendResult.updates && appendResult.updates.updatedRange) || "";
    const rowMatch = updatedRange.match(/![A-Z]+(\d+)/);
    const rowNum = rowMatch ? parseInt(rowMatch[1], 10) : null;
    const billNo = rowNum ? (rowNum - 1) : "?";
    if (rowNum){
      await updateCells(spreadsheetId, SHEET_TAB + "!A" + rowNum, [billNo]);
    }

    setStatus("Generating PDF...", "working");
    const pdfBlob = await generatePdfBlob();
    const filename = "Bill_" + billNo + "_" + (data.customerName || "Customer").replace(/[^a-z0-9]/gi, "_") + ".pdf";

    setStatus("Uploading PDF to Drive (" + FOLDER_NAME + ")...", "working");
    const uploaded = await uploadPdf(folderId, filename, pdfBlob);
    const pdfLink = uploaded.webViewLink || "";

    let calendarStatus = "No delivery date given";
    if (data.deliveryDate){
      setStatus("Setting delivery reminder...", "working");
      const event = await createCalendarEvent(data, billNo);
      calendarStatus = event.htmlLink ? "Reminder set" : ("Reminder failed: " + JSON.stringify(event.error || event));
    }

    if (rowNum){
      await updateCells(spreadsheetId, SHEET_TAB + "!M" + rowNum + ":N" + rowNum, [pdfLink, calendarStatus]);
    }

    setStatus("Bill #" + billNo + " saved.\nPDF: " + (pdfLink || "-") + "\n" + calendarStatus, "ok");
  }catch(err){
    setStatus("Save failed: " + err, "err");
  }finally{
    saveBtn.disabled = false;
  }
}

document.getElementById("printBtn").addEventListener("click", () => window.print());

document.getElementById("newBtn").addEventListener("click", () => {
  document.querySelectorAll("input").forEach(i => i.value = "");
  document.getElementById("receivedAmount").value = 0;
  setStatus("", "");
  recalc();
});
</script>

</body>
</html>
